<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>逆行列計算機</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4ef;
        --panel: #ffffff;
        --ink: #202124;
        --muted: #667085;
        --line: #d9d3c7;
        --accent: #0f766e;
        --accent-strong: #0b5f59;
        --danger: #b42318;
        --soft: #e7f5f2;
        --shadow: 0 18px 40px rgba(43, 35, 20, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        isolation: isolate;
        background: linear-gradient(120deg, #f8fff2 0%, #dcfff7 22%, #fff0fb 48%, #fff3d1 72%, #e9f0ff 100%);
        background-size: 420% 420%;
        animation: pageGradientPulse 12s ease-in-out infinite;
        color: var(--ink);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Noto Sans JP",
          sans-serif;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: -30%;
        z-index: -2;
        pointer-events: none;
      }

      body::before {
        background:
          radial-gradient(circle at 12% 18%, rgba(0, 221, 255, 0.62), transparent 24%),
          radial-gradient(circle at 88% 16%, rgba(255, 59, 209, 0.5), transparent 26%),
          radial-gradient(circle at 58% 76%, rgba(255, 199, 0, 0.52), transparent 28%),
          radial-gradient(circle at 24% 86%, rgba(57, 255, 136, 0.36), transparent 24%),
          linear-gradient(135deg, rgba(15, 118, 110, 0.2), rgba(255, 84, 112, 0.2), rgba(78, 124, 255, 0.22));
        filter: saturate(155%) contrast(108%) hue-rotate(0deg);
        animation:
          gradientDrift 9s ease-in-out infinite alternate,
          colorSpin 13s linear infinite;
      }

      body::after {
        inset: -24%;
        z-index: -1;
        background:
          conic-gradient(from 0deg at 50% 50%, rgba(0, 221, 255, 0.24), rgba(255, 59, 209, 0.26), rgba(255, 199, 0, 0.24), rgba(57, 255, 136, 0.2), rgba(0, 221, 255, 0.24)),
          radial-gradient(circle at 82% 78%, rgba(255, 84, 112, 0.32), transparent 26%),
          radial-gradient(circle at 10% 84%, rgba(78, 124, 255, 0.28), transparent 24%);
        mix-blend-mode: multiply;
        opacity: 0.9;
        animation:
          gradientFloat 12s ease-in-out infinite alternate,
          gradientSpin 20s linear infinite;
      }

      @keyframes pageGradientPulse {
        0% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes gradientDrift {
        0% {
          transform: translate3d(-6%, -4%, 0) scale(1) rotate(-4deg);
        }

        50% {
          transform: translate3d(5%, 3%, 0) scale(1.12) rotate(6deg);
        }

        100% {
          transform: translate3d(-2%, 7%, 0) scale(1.2) rotate(-7deg);
        }
      }

      @keyframes gradientFloat {
        0% {
          transform: translate3d(4%, 7%, 0) scale(1) rotate(0deg);
          opacity: 0.62;
        }

        100% {
          transform: translate3d(-5%, -4%, 0) scale(1.18) rotate(18deg);
          opacity: 0.95;
        }
      }

      @keyframes colorSpin {
        100% {
          filter: saturate(170%) contrast(112%) hue-rotate(360deg);
        }
      }

      @keyframes gradientSpin {
        100% {
          transform: rotate(360deg) scale(1.12);
        }
      }

      main {
        width: min(1160px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 48px;
      }

      .app-header {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 4.2rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .lead {
        margin: 0;
        max-width: 690px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.7;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--accent-strong);
        font-weight: 700;
        white-space: nowrap;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
        gap: 18px;
        align-items: start;
      }

      .tool,
      .output {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      label {
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 700;
      }

      select,
      input,
      button,
      textarea {
        font: inherit;
      }

      select,
      input {
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fff;
        color: var(--ink);
      }

      select {
        min-width: 86px;
        min-height: 40px;
        padding: 0 10px;
      }

      button {
        min-height: 40px;
        border: 0;
        border-radius: 7px;
        padding: 0 14px;
        position: relative;
        overflow: hidden;
        isolation: isolate;
        background: var(--accent);
        --burst-color: rgba(255, 255, 255, 0.56);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.16s ease,
          background 0.16s ease;
      }

      button:hover {
        background: var(--accent-strong);
        transform: translateY(-1px);
      }

      button.secondary {
        border: 1px solid var(--line);
        background: #fff;
        --burst-color: rgba(15, 118, 110, 0.24);
        color: var(--ink);
      }

      button.secondary:hover {
        background: #f9fafb;
      }

      .matrix-wrap {
        padding: 18px;
        overflow-x: auto;
      }

      .matrix-grid {
        display: grid;
        gap: 8px;
        width: max-content;
        min-width: 100%;
      }

      .cell {
        width: 88px;
        height: 46px;
        padding: 0 10px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 0 18px 18px;
      }

      .keypad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        max-width: 360px;
        padding: 0 18px 18px;
      }

      .keypad button {
        min-height: 52px;
        border: 1px solid var(--line);
        background: #fff;
        --burst-color: rgba(15, 118, 110, 0.22);
        color: var(--ink);
        font-size: 1.15rem;
        font-weight: 800;
      }

      .keypad button:hover {
        background: #f5f3ee;
      }

      .keypad button[data-action="calc"] {
        border: 0;
        background: var(--accent);
        --burst-color: rgba(255, 255, 255, 0.56);
        color: #fff;
      }

      .keypad button[data-action="calc"]:hover {
        background: var(--accent-strong);
      }

      .output {
        padding: 18px;
      }

      .result-header {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .result-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .mode-toggle {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        min-width: 250px;
        margin: 0;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf8;
      }

      .mode-toggle legend {
        padding: 0 4px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 800;
      }

      .mode-toggle label {
        position: relative;
        flex: 1;
        color: var(--ink);
      }

      .mode-toggle input {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .mode-toggle span {
        display: grid;
        place-items: center;
        min-height: 36px;
        border-radius: 6px;
        color: var(--muted);
        font-weight: 900;
        transition:
          background 0.16s ease,
          color 0.16s ease,
          box-shadow 0.16s ease;
      }

      .mode-toggle input:checked + span {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 20px rgba(15, 118, 110, 0.22);
      }

      .mode-toggle input:focus-visible + span {
        outline: 3px solid rgba(15, 118, 110, 0.26);
        outline-offset: 2px;
      }

      .message {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.65;
      }

      .message.error {
        color: var(--danger);
        font-weight: 700;
      }

      .result-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
        overflow: hidden;
        border-radius: 8px;
      }

      .result-table td,
      .result-table th {
        border: 1px solid var(--line);
        padding: 10px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        background: #fff;
      }

      .result-table th {
        width: 1%;
        color: var(--muted);
        background: #fbfaf8;
        text-align: center;
      }

      .meta {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--accent-strong);
        font-weight: 800;
      }

      .steps {
        margin-top: 16px;
      }

      .steps summary {
        cursor: pointer;
        color: var(--accent-strong);
        font-weight: 800;
      }

      .steps ol {
        margin: 10px 0 0;
        padding-left: 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      textarea {
        width: 100%;
        min-height: 108px;
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        resize: vertical;
        color: var(--ink);
        background: #fff;
      }

      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.55;
      }

      .button-burst {
        position: absolute;
        left: var(--burst-x);
        top: var(--burst-y);
        width: var(--burst-size);
        aspect-ratio: 1;
        border-radius: 999px;
        background: radial-gradient(circle, var(--burst-color) 0%, var(--burst-color) 28%, transparent 70%);
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.88;
        animation: buttonBurst 560ms ease-out forwards;
      }

      @keyframes buttonBurst {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.9;
        }

        70% {
          opacity: 0.38;
        }

        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body,
        body::before,
        body::after {
          animation: none;
        }

        button {
          transition: none;
        }
      }

      @media (max-width: 860px) {
        main {
          width: min(100% - 20px, 680px);
          padding-top: 20px;
        }

        .app-header,
        .workspace {
          grid-template-columns: 1fr;
        }

        .status-pill {
          justify-self: start;
        }

        .cell {
          width: 76px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="app-header">
        <div>
          <h1>逆行列計算機</h1>
          <p class="lead">
            2x2 から 6x6 までの正方行列に対応。小数や分数を入力して、逆行列・行列式・計算ステップを確認できます。
          </p>
        </div>
        <div class="status-pill" id="statusPill">準備完了</div>
      </header>

      <section class="workspace" aria-label="逆行列計算アプリ">
        <div class="tool">
          <div class="toolbar">
            <label for="sizeSelect">サイズ</label>
            <select id="sizeSelect" aria-label="行列サイズ">
              <option value="2">2 x 2</option>
              <option value="3" selected>3 x 3</option>
              <option value="4">4 x 4</option>
              <option value="5">5 x 5</option>
              <option value="6">6 x 6</option>
            </select>
            <button id="calculateBtn" type="button">計算</button>
            <button id="identityBtn" type="button" class="secondary">単位行列</button>
            <button id="exampleBtn" type="button" class="secondary">例を入力</button>
            <button id="clearBtn" type="button" class="secondary">クリア</button>
          </div>
          <div class="matrix-wrap">
            <div id="matrixGrid" class="matrix-grid" aria-label="行列入力"></div>
            <p class="hint">入力例: <code>1.5</code>, <code>-2</code>, <code>3/4</code>。空欄は 0 として扱います。</p>
          </div>
          <div class="actions">
            <button id="pasteBtn" type="button" class="secondary">CSVを貼り付け</button>
            <button id="copyBtn" type="button" class="secondary">結果をコピー</button>
          </div>
          <div class="keypad" id="keypad" role="group" aria-label="テンキー入力">
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-action="backspace" aria-label="一文字削除">⌫</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="/" aria-label="分数のスラッシュ">/</button>
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-action="sign" aria-label="符号反転">±</button>
            <button type="button" data-key=".">.</button>
            <button type="button" data-key="0">0</button>
            <button type="button" data-action="clear" aria-label="このセルをクリア">C</button>
            <button type="button" data-action="calc">計算</button>
          </div>
        </div>

        <aside class="output" aria-live="polite">
          <div class="result-header">
            <h2>計算結果</h2>
            <fieldset class="mode-toggle" aria-label="結果の表示形式">
              <legend>結果表示</legend>
              <label>
                <input type="radio" name="displayMode" value="fraction" checked />
                <span>分数</span>
              </label>
              <label>
                <input type="radio" name="displayMode" value="decimal" />
                <span>小数</span>
              </label>
            </fieldset>
          </div>
          <p id="message" class="message" role="alert">左の行列に値を入れて「計算」を押してください。</p>
          <div id="meta" class="meta" hidden></div>
          <div id="result"></div>
          <details class="steps" id="stepsBox" hidden>
            <summary>計算ステップ</summary>
            <ol id="steps"></ol>
          </details>
          <textarea id="csvInput" placeholder="CSV形式で行列を貼り付けできます。例:
1,2,3
0,1,4
5,6,0" hidden></textarea>
        </aside>
      </section>
    </main>

    <script src="matrix.js"></script>
    <script>
      const { Rational, parseRational, invert, formatRational } = MatrixMath;

      const sizeSelect = document.querySelector("#sizeSelect");
      const grid = document.querySelector("#matrixGrid");
      const message = document.querySelector("#message");
      const statusPill = document.querySelector("#statusPill");
      const result = document.querySelector("#result");
      const meta = document.querySelector("#meta");
      const stepsBox = document.querySelector("#stepsBox");
      const stepsList = document.querySelector("#steps");
      const csvInput = document.querySelector("#csvInput");
      const copyBtn = document.querySelector("#copyBtn");
      const keypad = document.querySelector("#keypad");
      const displayModeInputs = document.querySelectorAll('input[name="displayMode"]');

      let latestInverse = null;
      let latestResult = null;
      let activeCell = null;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      function playButtonBurst(button, event) {
        if (reducedMotion.matches) return;
        const rect = button.getBoundingClientRect();
        const x = event ? event.clientX - rect.left : rect.width / 2;
        const y = event ? event.clientY - rect.top : rect.height / 2;
        const size = Math.max(rect.width, rect.height) * 2.35;
        const burst = document.createElement("span");
        burst.className = "button-burst";
        burst.style.setProperty("--burst-x", `${x}px`);
        burst.style.setProperty("--burst-y", `${y}px`);
        burst.style.setProperty("--burst-size", `${size}px`);
        button.appendChild(burst);
        burst.addEventListener("animationend", () => burst.remove(), { once: true });
        window.setTimeout(() => burst.remove(), 700);
      }

      document.addEventListener(
        "pointerdown",
        (event) => {
          if (!(event.target instanceof Element)) return;
          const button = event.target.closest("button");
          if (!button || button.disabled) return;
          playButtonBurst(button, event);
        },
        { capture: true },
      );

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (!(event.target instanceof Element)) return;
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        playButtonBurst(button);
      });

      const examples = {
        2: [
          [4, 7],
          [2, 6],
        ],
        3: [
          [1, 2, 3],
          [0, 1, 4],
          [5, 6, 0],
        ],
        4: [
          [2, 1, 0, 3],
          [1, 0, 2, -1],
          [3, 2, 1, 0],
          [0, 1, -2, 1],
        ],
        5: [
          [1, 0, 2, -1, 3],
          [3, 1, 0, 2, -2],
          [2, -1, 1, 0, 1],
          [0, 2, -3, 1, 4],
          [1, 1, 1, 1, 0],
        ],
        6: [
          [2, 0, 1, 0, 3, -1],
          [1, 1, 0, 2, 0, 4],
          [0, 3, -1, 1, 2, 0],
          [4, 0, 2, -2, 1, 1],
          [1, -1, 3, 0, 0, 2],
          [0, 2, 1, 3, -1, 1],
        ],
      };

      // 数値の解析・整形は matrix.js（厳密有理数）に委譲。ここは表示形式（ラジオ）を
      // 読み取って formatRational に渡す薄いアダプタだけを持つ。
      function currentDisplayMode() {
        return document.querySelector('input[name="displayMode"]:checked').value;
      }

      function formatValue(rational) {
        return formatRational(rational, currentDisplayMode());
      }

      // 構造化された計算ステップ（matrix.js の invert が返す）を日本語文字列にする。
      function formatStep(step) {
        switch (step.type) {
          case "swap":
            return `R${step.a + 1} と R${step.b + 1} を交換`;
          case "scale":
            return `R${step.row + 1} を ${formatValue(step.by)} で割ってピボットを 1 にする`;
          case "eliminate":
            return `R${step.row + 1} から ${formatValue(step.factor)} x R${step.pivotRow + 1} を引く`;
          default:
            return "";
        }
      }

      function buildGrid(size) {
        grid.innerHTML = "";
        grid.style.gridTemplateColumns = `repeat(${size}, minmax(76px, 1fr))`;
        activeCell = null;
        latestInverse = null;
        latestResult = null;
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            const input = document.createElement("input");
            input.className = "cell";
            // 入力は画面上のテンキー（#keypad）で行うため、OS の仮想キーボードは出さない。
            // （物理キーボードでの入力や矢印キー移動は引き続き有効）
            input.inputMode = "none";
            input.autocomplete = "off";
            input.setAttribute("autocapitalize", "off");
            input.setAttribute("autocorrect", "off");
            input.spellcheck = false;
            input.setAttribute("aria-label", `${row + 1}行${col + 1}列`);
            input.dataset.row = row;
            input.dataset.col = col;
            grid.appendChild(input);
          }
        }
      }

      function readMatrix() {
        const size = Number(sizeSelect.value);
        const matrix = Array.from({ length: size }, () =>
          Array.from({ length: size }, () => Rational.fromInt(0)),
        );
        [...grid.querySelectorAll("input")].forEach((input) => {
          matrix[Number(input.dataset.row)][Number(input.dataset.col)] = parseRational(input.value);
        });
        return matrix;
      }

      function fillMatrix(matrix) {
        const size = matrix.length;
        sizeSelect.value = String(size);
        buildGrid(size);
        [...grid.querySelectorAll("input")].forEach((input) => {
          const value = matrix[Number(input.dataset.row)][Number(input.dataset.col)];
          input.value = value === 0 ? "" : String(value);
        });
      }

      function renderResult(data) {
        result.innerHTML = "";
        stepsList.innerHTML = "";
        stepsBox.hidden = !data.steps.length;
        latestResult = data;

        data.steps.forEach((step) => {
          const item = document.createElement("li");
          item.textContent = formatStep(step);
          stepsList.appendChild(item);
        });

        meta.hidden = false;
        meta.innerHTML = `<div>行列式 det(A): ${formatValue(data.determinant)}</div>`;

        if (!data.ok) {
          latestInverse = null;
          message.textContent = data.reason;
          message.className = "message error";
          statusPill.textContent = "逆行列なし";
          return;
        }

        latestInverse = data.inverse;
        message.textContent = "逆行列 A^-1 を計算しました。";
        message.className = "message";
        statusPill.textContent = "計算完了";

        const table = document.createElement("table");
        table.className = "result-table";
        data.inverse.forEach((row, rowIndex) => {
          const tr = document.createElement("tr");
          const th = document.createElement("th");
          th.textContent = rowIndex + 1;
          tr.appendChild(th);
          row.forEach((value) => {
            const td = document.createElement("td");
            td.textContent = formatValue(value);
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        result.appendChild(table);
      }

      function calculate() {
        try {
          const matrix = readMatrix();
          renderResult(invert(matrix));
          saveState();
        } catch (error) {
          latestInverse = null;
          latestResult = null;
          meta.hidden = true;
          result.innerHTML = "";
          stepsBox.hidden = true;
          message.textContent = error.message;
          message.className = "message error";
          statusPill.textContent = "入力エラー";
        }
      }

      function parseCsv(text) {
        // 空セル（連続カンマ）を 0 として保持する。カンマが無ければ空白/タブ区切りに対応。
        // 値は文字列のまま返し、3/4 や小数は readMatrix の parseRational に解釈させる。
        const lines = text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter((line) => line !== "");
        const rows = lines.map((line) =>
          line.includes(",") ? line.split(",").map((cell) => cell.trim()) : line.split(/\s+/),
        );
        const size = rows.length;
        if (size < 2 || size > 6 || rows.some((row) => row.length !== size)) {
          throw new Error("CSVは 2x2 から 6x6 の正方行列にしてください。");
        }
        return rows;
      }

      const STORAGE_KEY = "matrix-inverse-app:v1";
      let saveTimer = null;

      function readGridValues() {
        const size = Number(sizeSelect.value);
        const values = Array.from({ length: size }, () => Array(size).fill(""));
        grid.querySelectorAll("input").forEach((input) => {
          values[Number(input.dataset.row)][Number(input.dataset.col)] = input.value;
        });
        return values;
      }

      function saveState() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              size: Number(sizeSelect.value),
              values: readGridValues(),
              mode: currentDisplayMode(),
            }),
          );
        } catch {
          /* localStorage 不可（privateモード等）は無視 */
        }
      }

      function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(saveState, 300);
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const state = JSON.parse(raw);
          const size = Number(state.size);
          if (!(size >= 2 && size <= 6)) return null;
          if (!Array.isArray(state.values) || state.values.length !== size) return null;
          if (state.values.some((row) => !Array.isArray(row) || row.length !== size)) return null;
          return state;
        } catch {
          return null;
        }
      }

      // ---- 画面上テンキー ----
      function getActiveCell() {
        if (activeCell && activeCell.isConnected) return activeCell;
        activeCell = grid.querySelector("input");
        return activeCell;
      }

      function keypadInsert(cell, text) {
        const start = cell.selectionStart ?? cell.value.length;
        const end = cell.selectionEnd ?? cell.value.length;
        cell.value = cell.value.slice(0, start) + text + cell.value.slice(end);
        const pos = start + text.length;
        cell.setSelectionRange(pos, pos);
      }

      function keypadBackspace(cell) {
        const start = cell.selectionStart ?? cell.value.length;
        const end = cell.selectionEnd ?? cell.value.length;
        if (start !== end) {
          cell.value = cell.value.slice(0, start) + cell.value.slice(end);
          cell.setSelectionRange(start, start);
        } else if (start > 0) {
          cell.value = cell.value.slice(0, start - 1) + cell.value.slice(start);
          cell.setSelectionRange(start - 1, start - 1);
        }
      }

      function keypadToggleSign(cell) {
        cell.value = /^[-−－]/.test(cell.value)
          ? cell.value.replace(/^[-−－]/, "")
          : "-" + cell.value;
        cell.setSelectionRange(cell.value.length, cell.value.length);
      }

      // ボタン押下でセルのフォーカス（キャレット）を奪わないようにする。
      keypad.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button")) event.preventDefault();
      });
      keypad.addEventListener("click", (event) => {
        const btn = event.target.closest("button");
        if (!btn) return;
        if (btn.dataset.action === "calc") {
          calculate();
          return;
        }
        const cell = getActiveCell();
        if (!cell) return;
        const wasFocused = document.activeElement === cell;
        cell.focus();
        if (!wasFocused) cell.setSelectionRange(cell.value.length, cell.value.length);
        const action = btn.dataset.action;
        if (action === "backspace") keypadBackspace(cell);
        else if (action === "sign") keypadToggleSign(cell);
        else if (action === "clear") {
          cell.value = "";
          cell.setSelectionRange(0, 0);
        } else {
          keypadInsert(cell, btn.dataset.key);
        }
        scheduleSave();
      });
      grid.addEventListener("focusin", (event) => {
        if (event.target.matches("#matrixGrid input")) activeCell = event.target;
      });

      sizeSelect.addEventListener("change", () => {
        buildGrid(Number(sizeSelect.value));
        saveState();
      });
      document.querySelector("#calculateBtn").addEventListener("click", calculate);
      document.querySelector("#identityBtn").addEventListener("click", () => {
        const size = Number(sizeSelect.value);
        fillMatrix(Array.from({ length: size }, (_, row) => Array.from({ length: size }, (_, col) => (row === col ? 1 : 0))));
        calculate();
      });
      document.querySelector("#exampleBtn").addEventListener("click", () => {
        fillMatrix(examples[Number(sizeSelect.value)]);
        calculate();
      });
      document.querySelector("#clearBtn").addEventListener("click", () => {
        buildGrid(Number(sizeSelect.value));
        latestInverse = null;
        meta.hidden = true;
        result.innerHTML = "";
        stepsBox.hidden = true;
        latestResult = null;
        message.textContent = "左の行列に値を入れて「計算」を押してください。";
        message.className = "message";
        statusPill.textContent = "準備完了";
        saveState();
      });
      document.querySelector("#pasteBtn").addEventListener("click", () => {
        csvInput.hidden = !csvInput.hidden;
        if (!csvInput.hidden) csvInput.focus();
      });
      grid.addEventListener("keydown", (event) => {
        const target = event.target;
        if (!target.matches || !target.matches("#matrixGrid input")) return;
        if (event.key === "Enter") {
          event.preventDefault();
          calculate();
          return;
        }
        const size = Number(sizeSelect.value);
        const row = Number(target.dataset.row);
        const col = Number(target.dataset.col);
        const atStart = target.selectionStart === 0 && target.selectionEnd === 0;
        const atEnd =
          target.selectionStart === target.value.length &&
          target.selectionEnd === target.value.length;
        let next = null;
        if (event.key === "ArrowUp") next = [row - 1, col];
        else if (event.key === "ArrowDown") next = [row + 1, col];
        else if (event.key === "ArrowLeft" && atStart) next = [row, col - 1];
        else if (event.key === "ArrowRight" && atEnd) next = [row, col + 1];
        if (!next) return;
        const [r, c] = next;
        if (r < 0 || r >= size || c < 0 || c >= size) return;
        const cell = grid.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
        if (!cell) return;
        event.preventDefault();
        cell.focus();
        cell.setSelectionRange(cell.value.length, cell.value.length);
      });
      grid.addEventListener("input", scheduleSave);
      csvInput.addEventListener("input", () => {
        try {
          const matrix = parseCsv(csvInput.value);
          fillMatrix(matrix);
          calculate();
        } catch {
          statusPill.textContent = "CSV待機中";
        }
      });
      copyBtn.addEventListener("click", async () => {
        if (!latestInverse) {
          message.textContent = "コピーできる逆行列がまだありません。";
          message.className = "message error";
          statusPill.textContent = "コピー不可";
          return;
        }
        const text = latestInverse.map((row) => row.map(formatValue).join(",")).join("\n");
        try {
          if (!navigator.clipboard || !navigator.clipboard.writeText) {
            throw new Error("clipboard API が使えません");
          }
          await navigator.clipboard.writeText(text);
          message.textContent = "逆行列をクリップボードにコピーしました。";
          message.className = "message";
          statusPill.textContent = "コピー完了";
        } catch {
          // 非セキュアコンテキスト（file:// 等）や権限拒否時は手動コピーへフォールバック。
          csvInput.hidden = false;
          csvInput.value = text;
          csvInput.focus();
          csvInput.select();
          message.textContent = "自動コピーできませんでした。下のテキストを選択してコピーしてください。";
          message.className = "message";
          statusPill.textContent = "手動コピー";
        }
      });
      displayModeInputs.forEach((input) => {
        input.addEventListener("change", () => {
          if (latestResult) calculate();
          else saveState();
        });
      });

      const savedState = loadState();
      if (savedState) {
        // 前回の入力（サイズ・値・表示形式）を復元する。
        sizeSelect.value = String(savedState.size);
        buildGrid(savedState.size);
        grid.querySelectorAll("input").forEach((input) => {
          const v = savedState.values[Number(input.dataset.row)][Number(input.dataset.col)];
          input.value = typeof v === "string" ? v : "";
        });
        const modeInput = document.querySelector(
          `input[name="displayMode"][value="${savedState.mode}"]`,
        );
        if (modeInput) modeInput.checked = true;
        calculate();
      } else {
        buildGrid(Number(sizeSelect.value));
        fillMatrix(examples[3]);
        calculate();
      }
    </script>
  </body>
</html>
